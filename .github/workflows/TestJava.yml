name: Java CI with JUnit

on:
  push:
    branches: [ "main", "feature/part3" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download JUnit 4 and Hamcrest JARs
      run: |
        mkdir -p lib
        curl -L -o lib/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
        curl -L -o lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

    - name: Compile Source and Test Classes
      run: |
        mkdir -p build/classes
        javac -cp lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar -d build/classes *.java

    - name: Run JUnit Tests
      run: |
        java -cp build/classes:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar org.junit.runner.JUnitCore prog5121_part1.LoginTest prog5121_part1.MessageTest
